[package]
name = "darp-tesseract-upstream"
version = "0.35.0"

[package.build]
backend = { name = "pixi-build-cmake", version = "==0.3.14", channels = ["https://prefix.dev/pixi-build-backends", "conda-forge"] }

[package.build.source]
path = "../../native/tesseract"

[package.build.config]
extra-args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DTESSERACT_ENABLE_TESTING=OFF",
  "-DTESSERACT_ENABLE_EXAMPLES=OFF",
  "-DTESSERACT_ENABLE_BENCHMARKING=OFF",
  "-DTESSERACT_ENABLE_CODE_COVERAGE=OFF",
  "-DTESSERACT_BUILD_GZ_VISUALIZATION=OFF",
]

[package.host-dependencies]
ros-industrial-cmake-boilerplate = "*"
eigen = "*"
libboost-devel = "*"
cereal = "*"
console_bridge = "*"
tinyxml2 = "*"
yaml-cpp = "*"
boost-plugin-loader = "*"
assimp = "*"
octomap = "*"
orocos-kdl = "*"
pcl = "*"
bullet-cpp = "*"
fcl = "*"
opw-kinematics = "*"

# Tesseract's exported CMake targets expose these dependencies to consumers.
# Keep their headers and libraries in the environment that builds our wrapper.
[package.run-dependencies]
eigen = "*"
libboost-devel = "*"
cereal = "*"
console_bridge = "*"
tinyxml2 = "*"
yaml-cpp = "*"
boost-plugin-loader = "*"
assimp = "*"
octomap = "*"
orocos-kdl = "*"
pcl = "*"
bullet-cpp = "*"
fcl = "*"
opw-kinematics = "*"
